name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate public example
        run: |
          acg doctor --ledger examples/quickstart/events.jsonl
          acg validate-ledger examples/quickstart/events.jsonl
          acg lint --strict examples/quickstart/events.jsonl
          acg project examples/quickstart/events.jsonl --out-dir .artifacts/quickstart --title "Agent Case Graph Quickstart" --default-locale zh-CN

      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir .artifacts/wheel .
