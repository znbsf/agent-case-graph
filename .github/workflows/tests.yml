name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Install optional MCP adapter
        run: python -m pip install -e ".[mcp]"
      - name: Project planning and real MCP stdio
        run: python -m unittest tests.test_project_planning tests.test_project_query tests.test_project_session tests.test_project_input_boundaries tests.test_project_main_compatibility tests.test_mcp_server -v
      - name: Validate public example
        shell: bash
        run: |
          acg doctor --ledger examples/quickstart/events.jsonl
          acg validate-ledger examples/quickstart/events.jsonl
          acg lint --strict examples/quickstart/events.jsonl
          acg project examples/quickstart/events.jsonl --out-dir .artifacts/quickstart --title "Agent Case Graph Quickstart" --default-locale zh-CN

      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir .artifacts/wheel .
